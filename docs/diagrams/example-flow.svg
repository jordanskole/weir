<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="weir-example-title weir-example-desc">
      <title id="weir-example-title">weir: Person | birthday | expect Person</title>
      <desc id="weir-example-desc">Flowchart of weir's smallest example program: an origin produces a Person edge with age 41, the birthday node increments it to age 42, and the expect node branches into Pass or Fail depending on whether the result matches.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Origin -> birthday -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- birthday -> expect -->
      <line x1="500" y1="168" x2="500" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- expect YES -> Pass (happy path, coral) -->
      <line x1="500" y1="296" x2="500" y2="336" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- expect NO -> Fail -->
      <line x1="600" y1="248" x2="720" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (edge instances — the data on the wire) -->
      <rect x="452" y="96" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="105" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PERSON{AGE:41}</text>

      <rect x="452" y="178" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PERSON{AGE:42}</text>

      <rect x="484" y="306" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="315" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="644" y="238" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- Origin oval (start) -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Origin</text>
      <text x="500" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Unit → Person</text>

      <!-- birthday node (rectangle) -->
      <rect x="420" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">birthday</text>
      <text x="500" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Person → Person</text>

      <!-- expect node (diamond, decision) -->
      <polygon points="500,200 600,248 500,296 400,248" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="246" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">expect</text>
      <text x="500" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">age == 42 ?</text>

      <!-- Pass (end oval, focal — happy path) -->
      <rect x="420" y="336" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pass</text>
      <text x="500" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Person → Pass</text>

      <!-- Fail (end oval, default) -->
      <rect x="720" y="224" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail</text>
      <text x="800" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Person → Fail</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="472" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Origin / terminal edge</text>

      <rect x="260" y="472" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Node (pure function)</text>

      <polygon points="472,478 484,472 496,478 484,484" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="508" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Node — branches (oneOf)</text>

      <line x1="700" y1="480" x2="728" y2="480" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="736" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>
    </svg>
